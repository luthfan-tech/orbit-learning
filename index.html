<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit — Learning Platform</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23c6f24e%22/></svg>"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <a
          href="#"
          style="
            display: flex;
            align-items: center;
            gap: 0.55rem;
            text-decoration: none;
          "
        >
          <span class="orbit-dot"></span><span>Orbit</span>
        </a>
      </div>
      <nav class="crumbs" id="nav-crumbs"></nav>
    </header>

    <!-- MAIN VIEW: Just the student card -->
    <main id="view-dashboard">
      <section class="hero">
        <h1>Learning, in orbit.</h1>
        <p class="promise">⏱ Pages load in under 2 seconds.</p>
      </section>
      <section id="student-container" class="grid"></section>
    </main>

    <!-- PROFILE VIEW: Full dashboard for the student -->
    <main
      id="view-profile"
      class="page"
      hidden
      style="text-align: left; max-width: 800px"
    >
      <a
        href="#"
        style="
          font-size: 0.9rem;
          color: var(--muted);
          text-decoration: none;
          margin-bottom: 1rem;
          display: block;
        "
        >← Back to Home</a
      >
      <div id="profile-header" style="margin-bottom: 2rem"></div>
      <div class="grid">
        <div class="card">
          <h3>Current Focus</h3>
          <p
            id="p-focus"
            style="font-size: 1.2rem; font-weight: bold; margin-top: 0.5rem"
          ></p>
        </div>
        <div class="card">
          <h3>Overall Progress</h3>
          <div class="bar" style="margin-top: 1rem"><i id="p-bar"></i></div>
          <p
            id="p-progress"
            class="muted"
            style="margin-top: 0.5rem; font-weight: bold"
          ></p>
        </div>
      </div>
    </main>

    <!-- SECRET LOGIN VIEW -->
    <main id="view-login" class="page" hidden>
      <h1>🔒 Secret Login</h1>
      <p>Enter your GitHub Token to unlock editing and permanent saving.</p>
      <input
        type="password"
        id="token-input"
        placeholder="ghp_..."
        style="
          width: 100%;
          max-width: 400px;
          padding: 1rem;
          margin: 1rem 0;
          border: 1px solid var(--line);
          border-radius: 8px;
          font-size: 1rem;
        "
      />
      <div>
        <button class="btn" id="save-token">Unlock</button>
        <button class="btn-outline" onclick="window.location.hash = ''">
          Cancel
        </button>
      </div>
    </main>

    <!-- EDITOR VIEW -->
    <main
      id="view-edit"
      class="page"
      hidden
      style="text-align: left; max-width: 800px"
    >
      <h1>Update Progress</h1>
      <div id="editor-form"></div>
      <div style="margin-top: 2rem; display: flex; gap: 1rem">
        <button class="btn" id="save-editor">Save Permanently</button>
        <button class="btn-outline" onclick="window.location.hash = ''">
          Cancel
        </button>
      </div>
    </main>

    <footer class="foot">
      <span>© <span id="year"></span> Orbit</span>
      <span>
        <a href="#login" title="Admin Login">🔒 Admin</a>
      </span>
    </footer>

    <a
      href="#edit"
      id="floating-edit"
      class="floating-edit"
      style="text-decoration: none"
      hidden
      >✏️ Edit Data</a
    >

    <script src="data.js?v=4"></script>
    <script src="app.js?v=4"></script>
  </body>
</html>
